name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # R versions exercised by every smoke step: the macOS floor (4.1.0, the
  # oldest portable build the CDN publishes) and the current latest stable.
  # Both are verified to exist for all portable targets. Bump the latter as
  # new R releases land.
  R_VERSIONS: "4.1.0 4.5.1"
  # Package used to exercise the P3M binary-install + libR-patch path that
  # survives the portable-build migration. Small, has a compiled component.
  SMOKE_PKG: jsonlite

jobs:
  # One matrix entry per portable-r target with a native GitHub-hosted runner:
  # manylinux (glibc) x86_64 + arm64, macOS arm64, Windows x86_64.
  # macOS x86_64 (Intel) has no free native runner (macos-13 retired) and is
  # covered by the `test-macos-x86_64` Rosetta job below. musllinux is covered
  # by `test-musl` (x86_64) and `test-musl-arm64` (emulated).
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux-x86_64
            os: ubuntu-latest
          - target: manylinux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all

      - name: Test
        run: cargo test --all

      # End-to-end check of the portable-build download + extract path against
      # the live CDN, across the oldest and newest published R. `r install`
      # downloads, extracts, and validates `R --version` internally, so a clean
      # exit means each portable build runs on this OS/arch.
      - name: Smoke test R install
        shell: bash
        run: |
          set -euxo pipefail
          for v in $R_VERSIONS; do
            cargo run --quiet -- r install "$v"
          done
          cargo run --quiet -- r list --all

      # The activation tests resolve an R interpreter, so they skip in the
      # `cargo test` step above (which runs before any R exists). Re-run them
      # with the just-installed R on PATH — this is the only place the
      # PowerShell isolation assertion actually executes on Windows.
      - name: Test activation against installed R
        shell: bash
        run: |
          set -euxo pipefail
          latest="${R_VERSIONS##* }"
          # Windows portable builds put R.exe under bin/ and bin/x64/.
          rroot="$HOME/.uvr/r-versions/$latest"
          export PATH="$rroot/bin:$rroot/bin/x64:$PATH"
          R --version
          cargo test --test cli_tests activate

      # Exercise the P3M binary-package install + libR-path patching that the
      # portable-build migration keeps (sync.rs). Builds a throwaway project,
      # installs a package with a compiled component, and loads it under the
      # project library to prove the patched binary resolves libR at runtime.
      - name: Smoke test package sync
        shell: bash
        run: |
          set -euxo pipefail
          latest="${R_VERSIONS##* }"
          uvr_bin="$PWD/target/debug/uvr"
          [ -f "$uvr_bin.exe" ] && uvr_bin="$uvr_bin.exe"
          work="$(mktemp -d)"
          cd "$work"
          "$uvr_bin" init --here pkg-smoke --r-version "$latest"
          "$uvr_bin" add "$SMOKE_PKG"
          "$uvr_bin" sync
          # `uvr run` executes an R *file* against the project library; loading
          # the just-synced package proves its compiled binary resolves libR.
          printf 'library(%s); cat("pkg-smoke-ok\\n")\n' "$SMOKE_PKG" > check.R
          "$uvr_bin" run check.R

  # macOS x86_64 (Intel): no free native runner since GitHub retired macos-13.
  # Build uvr for x86_64-apple-darwin on the arm64 runner and run it under
  # Rosetta 2 — the binary is compiled with target_arch = "x86_64", so
  # Platform::detect() selects the Intel portable tarball, and Rosetta executes
  # both uvr and the downloaded Intel R. This gives real coverage of the Intel
  # download/extract path without a native Intel runner.
  test-macos-x86_64:
    name: Test (macos-x86_64, Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install Rust toolchain (x86_64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-x86_64-cargo-

      - name: Build (x86_64-apple-darwin)
        run: cargo build --target x86_64-apple-darwin -p uvr

      - name: Smoke test Intel R install under Rosetta
        shell: bash
        run: |
          set -euxo pipefail
          bin=./target/x86_64-apple-darwin/debug/uvr
          for v in $R_VERSIONS; do
            "$bin" r install "$v"
          done
          "$bin" r list --all

  # musllinux_1_2 x86_64 portable build: no GitHub-hosted musl runner exists.
  # Check out on the glibc host (node-based actions don't run on pure Alpine)
  # and build + smoke inside an Alpine container via `docker run`.
  test-musl:
    name: Test (musllinux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + smoke test in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e "R_VERSIONS=${R_VERSIONS}" alpine:3.21 sh -c '
            set -euxo pipefail
            # build-base/rustup compile uvr; ca-certificates + fontconfig + ttf-dejavu
            # are the runtime deps the portable musl R expects on the host.
            apk add --no-cache build-base musl-dev rustup \
              ca-certificates fontconfig ttf-dejavu
            rustup-init -y --default-toolchain stable --profile minimal
            . "$HOME/.cargo/env"
            cargo build --all
            for v in $R_VERSIONS; do
              cargo run --quiet -- r install "$v"
            done
            cargo run --quiet -- r list --all
          '

  # musllinux_1_2 arm64 portable build: no free arm64 musl runner. Cross-compile
  # uvr for aarch64-unknown-linux-musl at native speed (cross uses a toolchain
  # image, not emulation), then run the static binary in an emulated arm64 Alpine
  # via QEMU/binfmt. Only uvr + the downloaded arm64 R execute under emulation, so
  # this stays tractable. Marked continue-on-error: emulation is inherently
  # flakier than the native jobs and must not gate merges.
  test-musl-arm64:
    name: Test (musllinux-arm64, QEMU)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Cross-build (aarch64-unknown-linux-musl)
        run: cross build --target aarch64-unknown-linux-musl -p uvr

      - name: Smoke test in emulated arm64 Alpine
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/work" -w /work \
            -e "R_VERSIONS=${R_VERSIONS}" arm64v8/alpine:3.21 sh -c '
            set -euxo pipefail
            apk add --no-cache ca-certificates fontconfig ttf-dejavu
            bin=./target/aarch64-unknown-linux-musl/debug/uvr
            for v in $R_VERSIONS; do
              "$bin" r install "$v"
            done
            "$bin" r list --all
          '

  # Binary-repo selection across distros (#175).
  #
  # The `test` matrix above only runs on distros P3M publishes for, so it
  # cannot catch uvr choosing a repo whose binaries don't load here. Nor can
  # SMOKE_PKG: jsonlite links only libR and libc, so it loads no matter which
  # distro's binary you install. #175 needed a package with an *external*
  # system library — xml2 pulls libxml2, and that is exactly how it surfaced
  # (jammy binaries want libxml2.so.2; Arch ships .so.16).
  #
  # One static binary is built and reused so each container only runs uvr.
  build-static:
    name: Build static uvr (distro matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Static: runs on any glibc distro regardless of its version. uvr's own
      # libc/distro detection is all runtime (os-release, getconf), so a musl
      # build still identifies the glibc host correctly.
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl --bin uvr
      - uses: actions/upload-artifact@v4
        with:
          name: uvr-static
          path: target/x86_64-unknown-linux-musl/release/uvr
          retention-days: 1

  test-distros:
    name: Distro (${{ matrix.name }})
    needs: build-static
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not published by P3M — must degrade to the portable repo, NOT
          # claim to be Ubuntu (#175) and not silently drop to source.
          - name: arch (unmapped)
            image: archlinux:latest
            expect: manylinux_2_28
            setup: pacman -Sy --noconfirm --needed gcc make pkgconf which fontconfig ca-certificates libxml2
          - name: fedora (unmapped)
            image: fedora:42
            expect: manylinux_2_28
            setup: dnf -y install gcc gcc-c++ make pkgconf-pkg-config which fontconfig ca-certificates libxml2-devel
          # Repos uvr previously did not map, so these users compiled everything.
          - name: debian 13 (trixie)
            image: debian:trixie
            expect: trixie
            setup: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config ca-certificates fontconfig libxml2-dev
          - name: rocky 10 (rhel10)
            image: rockylinux/rockylinux:10
            expect: rhel10
            setup: dnf -y install gcc gcc-c++ make pkgconf-pkg-config which fontconfig ca-certificates libxml2-devel
    steps:
      # The C/C++ toolchain, pkg-config and libxml2 headers are needed only by
      # the `--no-binary` step; the binary path below needs none of them.
      - name: Install host prerequisites
        run: ${{ matrix.setup }}

      - uses: actions/download-artifact@v4
        with:
          name: uvr-static

      - name: Prepare uvr
        run: |
          set -eux
          install -m 0755 uvr /usr/local/bin/uvr
          uvr --version

      # The assertion that would have caught #175: uvr must pick the repo this
      # distro can actually run, not the one it guessed.
      - name: Binary repo selection
        run: |
          set -eux
          uvr doctor | tee doctor.txt
          grep -q "${{ matrix.expect }}" doctor.txt

      - name: Install R
        run: uvr r install "${R_VERSIONS##* }"

      # Install a package with an external system-library dependency and load
      # it. A wrong-repo binary installs fine and only fails here.
      - name: Install and load xml2
        run: |
          set -eux
          mkdir -p /tmp/distro-smoke && cd /tmp/distro-smoke
          uvr init --here distro-smoke --r-version "${R_VERSIONS##* }"
          printf 'library(xml2); stopifnot(xml_text(xml_find_first(read_xml("<a><b>ok</b></a>"), "//b")) == "ok"); cat("distro-smoke-ok\\n")\n' > check.R
          uvr add xml2
          uvr run check.R

      # The escape hatch must still produce a working package.
      - name: Force source build
        run: |
          set -eux
          mkdir -p /tmp/src-smoke && cd /tmp/src-smoke
          uvr init --here src-smoke --r-version "${R_VERSIONS##* }"
          printf 'library(xml2); cat("source-smoke-ok\\n")\n' > check.R
          uvr add xml2 --no-binary
          uvr run check.R

  # Guards the slug -> P3M repo table against drift: Posit adds repos as
  # distros ship and retires them at EOL, and both directions fail silently.
  test-p3m-repos:
    name: P3M repo coverage (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check every mapped repo still serves
        run: cargo test -p uvr-core --test p3m_repos_live -- --ignored --nocapture
      # The catalog is what answers at runtime; the table is only the offline
      # answer. A stale table is invisible until someone is offline, so the
      # comparison has to run somewhere that is online on a schedule.
      - name: Check the table still agrees with Posit's platform catalog
        run: cargo test -p uvr-core --test p3m_status_live -- --ignored --nocapture

  # install.ps1 has no coverage anywhere above: the windows-x86_64 matrix
  # entry in `test` builds uvr with cargo directly and never touches the
  # installer. Run it for real, against the latest published release, the
  # same way a user invoking `irm ... | iex` would. Catches asset-name
  # drift, a changed zip layout, and PATH-writing regressions — the three
  # things gdevenyi flagged as most likely to break silently between
  # releases (PR #224).
  test-install-script:
    name: Test install.ps1 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.ps1 into a temp dir
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "uvr-install-smoke"
          $env:UVR_INSTALL_DIR = $installDir
          .\install.ps1
          & (Join-Path $installDir "uvr.exe") --version

      - name: Verify the install dir was added to the user PATH
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "uvr-install-smoke"
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$installDir*") {
            Write-Error "install.ps1 did not add $installDir to the user PATH"
            exit 1
          }
          Write-Host "OK: $installDir present in user PATH"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
